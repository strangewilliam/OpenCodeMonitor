name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build app bundle
        run: |
          mkdir -p build/OpenCodeMonitor.app/Contents/MacOS
          swiftc -O -swift-version 5 -o build/OpenCodeMonitor.app/Contents/MacOS/OpenCodeMonitor main.swift
          cat > build/OpenCodeMonitor.app/Contents/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>OpenCodeMonitor</string>
              <key>CFBundleIdentifier</key><string>com.strangewilliam.opencodemonitor</string>
              <key>CFBundleName</key><string>OpenCode Monitor</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>${GITHUB_REF_NAME}</string>
              <key>CFBundleVersion</key><string>${GITHUB_RUN_NUMBER}</string>
              <key>LSMinimumSystemVersion</key><string>13.0</string>
              <key>LSUIElement</key><true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key><true/>
              </dict>
          </dict>
          </plist>
          EOF
          cd build && zip -r OpenCodeMonitor-${GITHUB_REF_NAME}.zip OpenCodeMonitor.app

      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          files: build/OpenCodeMonitor-*.zip
